
name: Python CI Pipeline

on:
  push:
    branches: [main, feature-ci-artifacts]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Compile Python code
        run: python -m compileall app tests

      - name: Run tests
        run: python -m pytest

      - name: Create application package
        run: zip -r python-app.zip app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-application
          path: python-app.zip

